<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cclog</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #1a1a2e;
      --bg-panel: #16213e;
      --bg-hover: #0f3460;
      --bg-selected: #0f3460;
      --border: #2a2a4a;
      --text: #e0e0e0;
      --text-muted: #9090b0;
      --text-dim: #6b7280;
      --green: #4ade80;
      --yellow: #facc15;
      --grey: #6b7280;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --danger: #f87171;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Layout ─────────────────────────────────────────── */

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────── */

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 48px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      font-weight: 700;
      font-size: 16px;
      color: var(--accent-light);
      letter-spacing: 0.05em;
    }

    .active-count {
      font-size: 13px;
      color: var(--text-muted);
      flex: 1;
    }

    .active-count .dot {
      color: var(--green);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="search"], select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 13px;
      outline: none;
    }

    input[type="search"] {
      width: 180px;
    }

    input[type="search"]:focus, select:focus {
      border-color: var(--accent-light);
    }

    select {
      cursor: pointer;
    }

    /* ── Disconnected banner ─────────────────────────────── */

    #disconnected-banner {
      display: none;
      background: #7c2d12;
      color: #fed7aa;
      text-align: center;
      padding: 6px;
      font-size: 13px;
      flex-shrink: 0;
    }

    #disconnected-banner.visible {
      display: block;
    }

    /* ── Main content area ───────────────────────────────── */

    .content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left panel ─────────────────────────────────────── */

    .sessions-panel {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--bg-panel);
    }

    .sessions-panel-header {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #session-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    #session-list::-webkit-scrollbar {
      width: 4px;
    }

    #session-list::-webkit-scrollbar-track {
      background: transparent;
    }

    #session-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .session-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 14px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.1s;
    }

    .session-item:hover {
      background: var(--bg-hover);
    }

    .session-item.selected {
      background: var(--bg-selected);
      border-left-color: var(--accent-light);
    }

    .session-dot {
      flex-shrink: 0;
      font-size: 10px;
      line-height: 20px;
    }

    .session-dot.active { color: var(--green); }
    .session-dot.idle   { color: var(--yellow); }
    .session-dot.closed { color: var(--grey); }

    .session-info {
      min-width: 0;
      flex: 1;
    }

    .session-cwd {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .session-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .empty-list {
      padding: 24px 14px;
      color: var(--text-dim);
      font-size: 13px;
      text-align: center;
    }

    /* ── Right panel ─────────────────────────────────────── */

    .detail-panel {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .detail-panel::-webkit-scrollbar {
      width: 4px;
    }

    .detail-panel::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .detail-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      gap: 8px;
    }

    .detail-placeholder .big-icon {
      font-size: 40px;
      opacity: 0.3;
    }

    /* ── Detail header ───────────────────────────────────── */

    .detail-header {
      margin-bottom: 20px;
    }

    .detail-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      word-break: break-all;
    }

    .detail-meta-grid {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 3px 16px;
      font-size: 13px;
    }

    .meta-label {
      color: var(--text-muted);
    }

    .meta-value {
      color: var(--text);
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
    }

    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-badge.active  { background: #14532d; color: var(--green); }
    .status-badge.idle    { background: #422006; color: var(--yellow); }
    .status-badge.closed  { background: #1f2937; color: var(--grey); }

    /* ── Stats summary ───────────────────────────────────── */

    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-top: 2px;
    }

    /* ── Tables ──────────────────────────────────────────── */

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      text-align: left;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--bg-panel);
    }

    tbody td {
      padding: 7px 10px;
      color: var(--text);
    }

    .num { text-align: right; font-variant-numeric: tabular-nums; }

    .tool-section {
      margin-bottom: 24px;
    }

    /* ── Raw events collapsible ──────────────────────────── */

    .raw-events-section {
      margin-top: 4px;
    }

    details {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    summary {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    summary::-webkit-details-marker { display: none; }

    summary::before {
      content: '▶';
      font-size: 9px;
      transition: transform 0.15s;
    }

    details[open] summary::before {
      transform: rotate(90deg);
    }

    details[open] summary {
      border-bottom: 1px solid var(--border);
    }

    .raw-events-table {
      max-height: 340px;
      overflow-y: auto;
    }

    .raw-events-table::-webkit-scrollbar {
      width: 4px;
    }

    .raw-events-table::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .phase-pre  { color: var(--yellow); font-size: 11px; }
    .phase-post { color: var(--green);  font-size: 11px; }

    /* ── Event JSON expand ───────────────────────────────── */

    .ev-toggle {
      cursor: pointer;
      font-size: 10px;
      color: var(--text-dim);
      user-select: none;
    }
    .ev-expandable:hover .ev-toggle { color: var(--text); }

    .ev-json-panel {
      display: flex;
      gap: 12px;
      padding: 8px 12px 12px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .ev-json-block {
      flex: 1;
      min-width: 220px;
    }

    .ev-json-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .ev-json-pre {
      margin: 0;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 11px;
      color: var(--text-muted);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
    }

    .monospace {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
    }

    /* ── Back button (mobile only) ───────────────────────── */

    #back-btn {
      display: none;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    #back-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    /* ── Mobile responsive ───────────────────────────────── */

    @media (max-width: 699px) {
      .content {
        flex-direction: column;
      }

      .sessions-panel {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .detail-panel {
        width: 100%;
        padding: 14px 16px;
      }

      /* When a session is selected on mobile, hide list, show detail */
      .content.mobile-detail-active .sessions-panel {
        display: none;
      }

      .content.mobile-detail-active .detail-panel {
        display: block;
      }

      .session-item {
        min-height: 44px;
        align-items: center;
      }

      header {
        flex-wrap: wrap;
        gap: 8px;
        height: auto;
        padding: 8px 16px;
      }

      .header-controls {
        flex-wrap: wrap;
      }

      #back-btn {
        display: inline-block;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <span class="logo">cclog</span>
      <span class="active-count" id="active-count">
        <span class="dot">●</span> <span id="active-count-num">0</span> active sessions
      </span>
      <div class="header-controls">
        <input
          type="search"
          id="search-input"
          placeholder="search by path…"
          autocomplete="off"
        >
        <select id="status-filter">
          <option value="all">All</option>
          <option value="active">Active only</option>
          <option value="active_idle">Idle + Active</option>
        </select>
      </div>
    </header>

    <div id="disconnected-banner">
      Disconnected — reconnecting…
    </div>

    <div class="content">
      <aside class="sessions-panel">
        <div class="sessions-panel-header">Sessions</div>
        <div id="session-list"></div>
      </aside>

      <main class="detail-panel" id="detail-panel">
        <div class="detail-placeholder">
          <div class="big-icon">◫</div>
          <div>Select a session to see details</div>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
